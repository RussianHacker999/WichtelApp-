# Projektweite Gradle-Einstellungen.
# Hinweis für IDE-Nutzer (z. B. Android Studio): In der IDE gesetzte Gradle-Einstellungen
# überschreiben die Werte in dieser Datei.
# Details zur Build-Umgebung: http://www.gradle.org/docs/current/userguide/build_environment.html
# JVM-Argumente für den Gradle-Daemon (vor allem Arbeitsspeicher).
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Damit würde Gradle Module parallel bauen (experimentell). Nur für entkoppelte Projekte sinnvoll; Details:
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# Hier deaktiviert, das Projekt hat nur ein Modul.
# org.gradle.parallel=true
# Der Configuration Cache lässt Gradle die Konfigurationsphase überspringen, wenn sich nichts geändert hat,
# was die Build-Konfiguration beeinflusst (z. B. Build-Skripte), und beschleunigt die Ausführung der Tasks.
org.gradle.configuration-cache=true
# Kotlin-Codestil des Projekts: "official" oder "obsolete":
kotlin.code.style=official
android.disallowKotlinSourceSets=false