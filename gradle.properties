# Project-wide Gradle settings.
# Note for IDE users (e.g. Android Studio): Gradle settings configured in the IDE
# override the values in this file.
# Details on the build environment: http://www.gradle.org/docs/current/userguide/build_environment.html
# JVM arguments for the Gradle daemon (mainly memory).
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# This would make Gradle build modules in parallel (experimental). Only useful for decoupled projects; details:
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# Disabled here, because the project has only one module.
# org.gradle.parallel=true
# The configuration cache lets Gradle skip the configuration phase when nothing that affects the build
# configuration has changed (e.g. build scripts), and speeds up task execution.
org.gradle.configuration-cache=true
# Kotlin code style of the project: "official" or "obsolete":
kotlin.code.style=official
android.disallowKotlinSourceSets=false